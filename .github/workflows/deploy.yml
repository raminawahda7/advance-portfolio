name: Deploy to Vercel

# Deploys the portfolio to Vercel on every push to main.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        — Vercel account token (vercel.com/account/tokens)
#   VERCEL_ORG_ID       — from `.vercel/project.json` after `vercel link`
#   VERCEL_PROJECT_ID   — from `.vercel/project.json` after `vercel link`
#   DATABASE_URL        — Supabase/Postgres connection string (for schema sync)
#
# Also set DATABASE_URL and ADMIN_PASSWORD in the Vercel project's env
# (Production) so the deployed app has them at runtime.
#
# NOTE: this pipeline syncs the DB *schema* (prisma db push) but never seeds —
# seeding is a one-time manual step so production data / admin edits are safe.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync database schema (Postgres)
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
